apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - middleware.yaml

commonLabels:
  app: cliet-tableaux-api
  tier: backend
  managed-by: argocd

images:
  - name: api-image
    newName: ghcr.io/benjaliette/cliet-tableaux-api
    newTag: latest
