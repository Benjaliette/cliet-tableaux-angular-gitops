name: Update API Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT }}

      - name: Create production secret
        run: |
          cat > api/overlays/prod/secret.yaml << EOFINNER
          apiVersion: v1
          kind: Secret
          metadata:
            name: cliet-tableaux-api-secrets
            namespace: production
          type: Opaque
          stringData:
            database-url: "${{ secrets.DATABASE_URL }}"
            database-username: "${{ secrets.DATABASE_USER }}"
            database-password: "${{ secrets.DATABASE_PASSWORD }}"
            jwt-secret: "${{ secrets.JWT_KEY }}"
            cloudinary-secret: "${{ secrets.CLOUDINARY_API_SECRET }}"
            sendgrid-secret: "${{ secrets.SENDGRID_API_KEY }}"
            stripe-secret: "${{ secrets.STRIPE_API_KEY }}"
            stripe-webhook-secret: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          EOFINNER

      - name: 📤 Commit and push secrets
        run: |
          # ✅ Reconfigurer l'URL remote avec le token
          git remote set-url origin https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/Benjaliette/cliet-tableaux-angular-gitops.git

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add api/overlays/prod/secret.yaml

          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "🔐 chore: update API secrets [skip ci]"
            git push origin main
          fi
